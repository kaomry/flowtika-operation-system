services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowtika
      POSTGRES_PASSWORD: flowtika
      POSTGRES_DB: flowtika
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtika"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
